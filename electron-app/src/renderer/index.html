<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DrawSync</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="top-bar">
      <span id="connection-status" class="disconnected">● 未连接</span>
      <span id="connection-ip">端口 8080 等待连接...</span>
      <div id="top-actions">
        <button id="btn-copy">复制</button>
        <button id="btn-save">保存</button>
      </div>
    </div>

    <!-- 翻页条 -->
    <div id="page-bar">
      <button id="btn-page-prev">← 上一页</button>
      <span id="page-indicator">1 / 1</span>
      <button id="btn-page-next">下一页 →</button>
      <button id="btn-page-new">＋ 新建页面</button>
      <button id="btn-page-delete">删除本页</button>
    </div>

    <canvas id="canvas"></canvas>

    <div id="toolbar">
      <div id="mode-buttons">
        <button id="mode-eraser-stroke" class="mode-btn active">擦笔画</button>
        <button id="mode-eraser-region" class="mode-btn">擦区域</button>
        <button id="mode-lasso" class="mode-btn">套索</button>
        <button id="btn-undo" class="action-btn">撤销</button>
        <button id="btn-clear" class="action-btn danger">清空</button>
      </div>
      <span id="tool-hint">（擦除/撤销/清空操作在平板上执行）</span>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
