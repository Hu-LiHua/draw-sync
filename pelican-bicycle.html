<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican Riding a Bicycle</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#aee3f7 0%, #d8f0fa 55%, #cfe8c8 55%, #b7dba9 100%);
    font-family: "Segoe UI", "PingFang SC", sans-serif;
  }
  .stage { width: min(92vw, 860px); }
  .caption { text-align: center; color: #3a5a40; margin-top: 14px; font-size: 15px; }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车前进的动画">
  <!-- 太阳 -->
  <circle cx="690" cy="80" r="36" fill="#ffd45e">
    <animate attributeName="r" values="36;40;36" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- 云：横向飘动 -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="140" cy="80" rx="46" ry="18"/><ellipse cx="180" cy="70" rx="34" ry="15"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 80 0; 0 0" dur="26s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="480" cy="55" rx="38" ry="14"/><ellipse cx="512" cy="48" rx="26" ry="11"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 0; 0 0" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 远处小山 -->
  <path d="M0 300 Q 120 210 260 300 T 520 300 T 800 300 V 450 H 0 Z" fill="#a8cba0" opacity="0.55"/>

  <!-- 路面 -->
  <rect x="0" y="352" width="800" height="10" fill="#8a7f72"/>
  <!-- 路面虚线：向左滚动制造前进感 -->
  <g stroke="#f4efe6" stroke-width="6" stroke-dasharray="34 46">
    <line x1="0" y1="392" x2="800" y2="392">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ==== 自行车 ==== -->
  <g>
    <!-- 车轮 -->
    <g stroke="#333" stroke-width="7" fill="none">
      <circle cx="250" cy="352" r="62"/>
      <circle cx="530" cy="352" r="62"/>
    </g>
    <g stroke="#9a9a9a" stroke-width="3">
      <!-- 后轮辐条旋转 -->
      <g>
        <line x1="250" y1="290" x2="250" y2="414"/><line x1="188" y1="352" x2="312" y2="352"/>
        <line x1="206" y1="308" x2="294" y2="396"/><line x1="294" y1="308" x2="206" y2="396"/>
        <animateTransform attributeName="transform" type="rotate" from="0 250 352" to="360 250 352" dur="0.9s" repeatCount="indefinite"/>
      </g>
      <!-- 前轮辐条旋转 -->
      <g>
        <line x1="530" y1="290" x2="530" y2="414"/><line x1="468" y1="352" x2="592" y2="352"/>
        <line x1="486" y1="308" x2="574" y2="396"/><line x1="574" y1="308" x2="486" y2="396"/>
        <animateTransform attributeName="transform" type="rotate" from="0 530 352" to="360 530 352" dur="0.9s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 车架 -->
    <g stroke="#e2574c" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="250" y1="352" x2="390" y2="352"/>           <!-- 后轴-五通 -->
      <line x1="390" y1="352" x2="345" y2="255"/>           <!-- 五通-座管顶 -->
      <line x1="345" y1="255" x2="250" y2="352"/>           <!-- 座管顶-后轴 -->
      <line x1="345" y1="255" x2="500" y2="255"/>           <!-- 上管 -->
      <line x1="390" y1="352" x2="500" y2="255"/>           <!-- 下管 -->
      <line x1="500" y1="255" x2="530" y2="352"/>           <!-- 前叉 -->
    </g>
    <!-- 车座 -->
    <line x1="345" y1="255" x2="338" y2="232" stroke="#555" stroke-width="7"/>
    <path d="M316 230 q 22 -12 46 -2 q -20 12 -46 2 Z" fill="#5a3b2e"/>
    <!-- 车把 -->
    <line x1="500" y1="255" x2="512" y2="222" stroke="#555" stroke-width="7"/>
    <path d="M486 218 q 26 -12 44 4" stroke="#555" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- 曲柄与踏板 -->
    <g stroke="#444" stroke-width="6" stroke-linecap="round">
      <line x1="390" y1="352" x2="412" y2="326"/>
      <line x1="390" y1="352" x2="368" y2="378"/>
      <animateTransform attributeName="transform" type="rotate" from="0 390 352" to="360 390 352" dur="0.9s" repeatCount="indefinite"/>
    </g>
    <g fill="#222">
      <rect x="400" y="318" width="24" height="10" rx="3">
        <animateTransform attributeName="transform" type="rotate" from="0 390 352" to="360 390 352" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="356" y="376" width="24" height="10" rx="3">
        <animateTransform attributeName="transform" type="rotate" from="0 390 352" to="360 390 352" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ==== 鹈鹕 ==== -->
  <g>
    <!-- 后腿（远侧，踩踏板） -->
    <path id="legFar" d="M395 330 L 410 320 L 368 378" stroke="#e8973f" stroke-width="12" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M395 330 L 410 320 L 368 378; M395 330 L 372 330 L 412 326; M395 330 L 410 320 L 368 378" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <!-- 尾羽 -->
    <path d="M398 300 q -34 4 -48 30 q 26 4 48 -14 Z" fill="#f2f2f2" stroke="#c9c9c9" stroke-width="2"/>
    <!-- 身体 -->
    <ellipse cx="430" cy="300" rx="88" ry="52" fill="#f7f7f7" stroke="#c9c9c9" stroke-width="2"/>
    <!-- 翅膀（随骑行轻微摆动） -->
    <path d="M418 278 q -52 -6 -76 32 q 40 22 84 -4 Z" fill="#e8973f" stroke="#c97f2c" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="-3 448 286; 4 448 286; -3 448 286" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <!-- 前腿（近侧，踩踏板） -->
    <path d="M420 342 L 428 336 L 412 326" stroke="#f0a54a" stroke-width="13" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M420 342 L 428 336 L 412 326; M420 342 L 412 372 L 380 380; M420 342 L 428 336 L 412 326" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <!-- 脖子 -->
    <path d="M492 274 q 34 -30 30 -76" stroke="#f7f7f7" stroke-width="24" fill="none" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="524" cy="188" r="30" fill="#f7f7f7" stroke="#c9c9c9" stroke-width="2"/>
    <!-- 大喙 + 喉囊 -->
    <path d="M548 180 q 52 4 74 24 l -6 10 q -40 8 -70 -8 Z" fill="#f4b942" stroke="#d99a2b" stroke-width="2"/>
    <path d="M548 196 q 30 26 66 18 q -16 16 -44 10 q -16 -4 -22 -28 Z" fill="#f8d57a" stroke="#d99a2b" stroke-width="2"/>
    <!-- 眼睛 -->
    <circle cx="530" cy="180" r="5" fill="#222">
      <animate attributeName="ry" values="5;5;0.8;5" keyTimes="0;0.9;0.94;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- 羽毛冠 -->
    <path d="M508 164 q 4 -14 16 -18 q -2 10 -4 16 Z" fill="#e8973f"/>
  </g>

  <!-- 头顶冒出的"呼哧"小气泡 -->
  <g fill="none" stroke="#7fb2c9" stroke-width="2" opacity="0.8">
    <circle cx="545" cy="140" r="4">
      <animate attributeName="cy" values="140;118" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="556" cy="132" r="3">
      <animate attributeName="cy" values="132;108" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
<p class="caption">🚲 一只努力蹬车的鹈鹕 · 纯 SVG + SMIL 动画，无 JavaScript</p>
</div>
</body>
</html>
